# Firebase App Hosting configuration for Dynasty Estates.
#
# These NEXT_PUBLIC_* values are inlined into the client bundle at build time,
# so they must be available at BUILD, not only RUNTIME. They are deliberately
# plain values rather than secrets: a Firebase web API key is a project
# identifier that ships to every browser by design. Access is controlled by
# firestore.rules and the Authentication provider settings, not by hiding it.

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBFx4pj0BjhAKMZMlfcw7Kmyx4SjoEbtiw
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: dynasty-estates.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: dynasty-estates
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: dynasty-estates.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "920857909750"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:920857909750:web:735ee5e3ec241057830fd7"
    availability:
      - BUILD
      - RUNTIME
