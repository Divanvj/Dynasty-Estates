name: Dynasty Estates CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# CI only reads the code (audit item 1.9): the workflow token cannot push,
# change settings or write to the repository.
permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck & Automated Domain Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      # The production build, as Vercel runs it (audit item 1.9). Catches
      # what the type check cannot: config, route and bundling errors.
      # No secrets: without Firebase settings the build still completes.
      - name: Build the production app
        run: npm run build

      - name: Run automated domain test suite
        run: node tests/domain.test.mjs

      - name: Run automated SEO test suite
        run: node tests/seo.test.mjs

      - name: Run automated duplicate detection test suite
        run: node tests/duplicate-detector.test.mjs

      # Photo checks (format, sharpness, screenshots, perceptual-hash
      # duplicates): 14 tests on the real code, not run in CI until now.
      - name: Run photo-analysis tests
        run: node --test tests/photo-analysis.test.mjs

      - name: Run sign-in return-path tests
        run: node tests/return-path.test.mjs

      - name: Run listing market-status tests
        run: node tests/listing-status.test.mjs

      - name: Run certificate-reminder tests
        run: node tests/ffc-reminders.test.mjs

      - name: Run price-drop tests
        run: node tests/price-drops.test.mjs

      - name: Run unsubscribe-token tests
        run: node tests/unsubscribe-token.test.mjs

      # Firestore security rules (S1-4): every role and collection against the
      # local emulator, which needs Java. No secrets: the demo- project id keeps
      # the emulator offline.
      - name: Setup Java 21 for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run Firestore security-rule tests
        run: npm run test:rules


